apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: Release WF
on:
  workflow_dispatch:
    inputs:
      manifest:
        type: string
        required: true
        description: System-generated manifest for releases
metadata:
  stages/v1alpha1:
    - name: DEV
      jobs:
        - DEV
        - Approve
        - zxczx
    - name: STAGING
      jobs:
        - STAGING
    - name: PROD
      jobs:
        - PROD
jobs:
  DEV:
    environment: DEV
    uses: ./.cloudbees/workflows/deployer.yaml
    vars: inherit
    secrets: inherit
    with:
      manifest: ${{ inputs.manifest }}
      environment: ${{ job.environment }}
  Approve:
    needs: DEV
    timeout-minutes: 4320
    delegates: cloudbees-io/manual-approval/custom-job.yml@v1
    with:
      disallowLaunchByUser: false
      notifyAllEligibleUsers: false
      approvers: ""
      approvalInputs: |
        Comment:
          type: string
  STAGING:
    needs: zxczx
    environment: STAGING
    uses: ./.cloudbees/workflows/deployer.yaml
    vars: inherit
    secrets: inherit
    with:
      manifest: ${{ inputs.manifest }}
      environment: ${{ job.environment }}
  PROD:
    needs: STAGING
    environment: PROD
    uses: ./.cloudbees/workflows/deployer.yaml
    vars: inherit
    secrets: inherit
    with:
      manifest: ${{ inputs.manifest }}
      environment: ${{ job.environment }}
  zxczx:
    needs:
      - Approve
    timeout-minutes: 4320
    delegates: cloudbees-io/manual-approval/custom-job.yml@v1
    with:
      disallowLaunchByUser: false
      notifyAllEligibleUsers: false
