apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: deployer

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      version:
        type: string
        required: true

jobs:

  taskflow-frontend:
    uses: jfair9/taskflow-frontend/.cloudbees/workflows/deploy.yaml
    vars: inherit
    secrets: inherit
    with:
      version: ${{ inputs.version }}
      environment: ${{ inputs.environment }}
