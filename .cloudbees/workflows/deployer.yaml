apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: deployer

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      manifest:
        type: string
        required: true

jobs:

  taskflow-frontend:
    uses: jfair9/taskflow-frontend/.cloudbees/workflows/deploy.yaml
    vars: inherit
    secrets: inherit
    with:
      artifact-id: ${{ fromJSON(inputs.manifest)['taskflow-frontend']['docker.io/mock/frontend'].id }}
      version: ${{ fromJSON(inputs.manifest)['taskflow-frontend']['docker.io/mock/frontend'].version }}
      environment: ${{ inputs.environment }}
